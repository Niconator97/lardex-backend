services:
  postgres:
    image: 'postgres:18'
    container_name: lardex-postgres
    environment:
      - 'POSTGRES_DB=lardex'
      - 'POSTGRES_PASSWORD=lardex'
      - 'POSTGRES_USER=lardex'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lardex -d lardex"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
